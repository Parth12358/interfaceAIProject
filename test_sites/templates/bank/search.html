{% extends base %}
{% block body %}
<form action="{{ url_for(request.blueprint ~ '.search') }}" method="post">
<table cellpadding="10" cellspacing="0" border="1" bgcolor="#ffffff" width="100%"
       style="border-color:#8a97a6;">
  <tr><td colspan="2"><b>{{ labels.prompt }}</b></td></tr>
  <tr>
    <td align="right" width="40%">{{ labels.member }}</td>
    <td><input type="text" name="member_key" size="20" maxlength="12" autocomplete="off"></td>
  </tr>
  <tr>
    <td>&nbsp;</td>
    <td><input type="submit" class="btn" value="{{ labels.button }}"></td>
  </tr>
</table>
</form>
{% endblock %}
