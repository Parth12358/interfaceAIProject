{% extends "vaultcore/base.html" %}
{% block body %}
<table width="80%" align="center" class="legacy" cellpadding="14" cellspacing="0" border="0"><tr><td align="center">
  <font size="3" color="{{ theme.bad }}"><b>Session expired</b></font>
  <hr>
  <font size="2" color="#333333">
    Your session was idle and has expired. Use the button below to resume where you left off.
  </font>
  <br><br>
  <form action="{{ url_for(request.blueprint ~ '.continue_session') }}" method="post">
    <input type="submit" class="btn" value="Continue">
  </form>
</td></tr></table>
{% endblock %}
