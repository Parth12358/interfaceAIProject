<!DOCTYPE html>
<html>
<head><title>{{ page_title or "CoreServ" }}</title>
<style>
  a { text-decoration: none; }
  /* Larger, high-contrast buttons so the control text is OCR-readable (form
     button chrome otherwise renders the label too small/low-contrast to read). */
  input[type=submit], input[type=reset], button {
    font-size: 15px; font-family: Verdana, sans-serif; padding: 5px 18px;
    color: #000000; background: #e6e6e6; border: 1px solid #808080;
  }
</style>
</head>
<body bgcolor="#e8ecf0" style="margin:0;font-family:Verdana,Geneva,sans-serif;">
<!-- Persistent brand masthead: "CoreServ" is the app_ready precondition anchor. -->
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td bgcolor="#12233a" height="40">
    &nbsp;<font size="4" color="#ffffff"><b>CoreServ</b></font>
    &nbsp;&nbsp;&nbsp;<font size="2" color="#bcd0ea">Core Banking Terminal</font>
  </td></tr>
  <tr><td bgcolor="#1f3a5f" height="30">
    &nbsp;<font size="3" color="#ffffff"><b>{% block title_bar %}{% endblock %}</b></font>
  </td></tr>
</table>
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr valign="top">
    <!-- Left navigation column (nested table, no ids) -->
    <td width="200" bgcolor="#dfe6ee">
      <table cellpadding="6" cellspacing="0" border="0" width="100%">
        <tr><td><font size="1" color="#5a6b80"><b>NAVIGATION</b></font></td></tr>
        <tr><td><a href="/search"><font color="#1f3a5f" size="2">Member Lookup</font></a></td></tr>
        <tr><td><a href="/"><font color="#1f3a5f" size="2">Accounts</font></a></td></tr>
        <tr><td><a href="/"><font color="#1f3a5f" size="2">Transactions</font></a></td></tr>
        <tr><td><a href="/"><font color="#1f3a5f" size="2">Administration</font></a></td></tr>
      </table>
    </td>
    <!-- Content -->
    <td>
      <table width="95%" align="center" cellpadding="10" cellspacing="0" border="0"><tr><td>
        <br>{% block content %}{% endblock %}
      </td></tr></table>
    </td>
  </tr>
</table>
</body>
</html>
