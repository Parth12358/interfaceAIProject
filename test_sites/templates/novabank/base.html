<!DOCTYPE html>
<html>
<head>
  <title>{{ tenant.institution }} — {{ tenant.product }}</title>
  <style>
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
           background:#f7f8fa; color:#111827; }
    .top { background:{{ theme.masthead }}; color:#fff; padding:14px 24px;
           display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:20px; font-weight:700; }
    .sub { color:#9ca3af; font-size:12px; }
    .wrap { max-width:960px; margin:26px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px;
            padding:22px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .btn { background:#e5edff; color:#1d4ed8; border:1px solid #93b4f5;
           border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer;
           display:inline-block; font-weight:600; }
    .btn.secondary { background:#e5e7eb; color:#111827; }
    label { display:block; font-size:13px; color:#374151; margin:12px 0 4px; }
    input[type=text], input[type=number] { width:100%; max-width:360px; padding:9px;
           border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
    a { color:{{ theme.link }}; text-decoration:none; }
    h1 { font-size:22px; margin:0 0 6px; }
    h2 { font-size:16px; color:#374151; }
    .row { display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;
           padding:9px 0; font-size:15px; }
    .muted { color:#6b7280; font-size:12px; }
    .alert { border-radius:8px; padding:12px 14px; font-size:14px; margin-bottom:14px; }
    .alert.bad { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
    .alert.warn { background:#fffbeb; border:1px solid #fde68a; color:#92400e; }
    .alert.ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; }
    .radio-row { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; }
    .radio-row label { display:inline-flex; align-items:center; gap:6px; margin:0; font-size:15px; }
  </style>
</head>
<body>
<div class="top">
  <div><span class="brand">{{ tenant.institution }}</span>
       <span class="sub">&nbsp;{{ tenant.product }}</span></div>
  <div class="sub">{{ tenant.tagline }}</div>
</div>
<div class="wrap">
  {% block body %}{% endblock %}
</div>
</body>
</html>
