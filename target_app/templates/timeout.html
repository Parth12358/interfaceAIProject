<!DOCTYPE html>
<html>
<head><title>Session Expired</title></head>
<body bgcolor="#e8ecf0" style="font-family:Verdana,Geneva,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td bgcolor="#5f1f1f" height="46">&nbsp;
    <font size="4" color="#ffffff"><b>&nbsp;Session Notice</b></font>
  </td></tr>
</table>
<br>
<table width="70%" align="center" cellpadding="14" cellspacing="0" border="1" bgcolor="#ffffff">
  <tr><td align="center">
    <font size="3" color="#a11313"><b>Session expired</b></font>
    <hr>
    <font size="2" color="#333333">
      Your session was idle and has expired. Use the button below to resume where you left off.
    </font>
    <br><br>
    <form action="/continue" method="post">
      <input type="submit" value="Continue"
             style="font-size:15px;font-family:Verdana,sans-serif;padding:5px 18px;color:#000;background:#e6e6e6;border:1px solid #808080;">
    </form>
  </td></tr>
</table>
</body>
</html>
